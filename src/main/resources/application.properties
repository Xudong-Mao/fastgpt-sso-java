# Server Configuration
server.port=${SERVER_PORT:8080}

# Application Configuration
spring.application.name=${SPRING_APPLICATION_NAME:fastgpt-sso-java}

# SSO Provider: test | weaver
# weaver 时使用泛微 CAS 对接实现（主动校验模式）
app.sso.provider=${APP_SSO_PROVIDER:${SSO_PROVIDER:weaver}}
app.auth.token=${APP_AUTH_TOKEN:${AUTH_TOKEN:}}
app.redirect.enabled=${APP_REDIRECT_ENABLED:${REDIRECT_ENABLED:false}}
app.hostname=${APP_HOSTNAME:${HOSTNAME:}}
app.sso.debug=${SSO_DEBUG:false}

# ========== 泛微 Ecology SSO 配置 ==========
# 是否启用泛微SSO
weaver.sso.enabled=${WEAVER_SSO_ENABLED:true}
weaver.sso.debug=${SSO_DEBUG:false}
# CAS 服务端地址（泛微OA地址，如 http://11.41.154.72:8080）
weaver.sso.server-url=${WEAVER_SSO_SERVER_URL:}
# CAS 登录路径（默认 /login/login.jsp）
weaver.sso.login-path=${WEAVER_SSO_LOGIN_PATH:/login/login.jsp}
# 应用标识（在泛微统一认证中心注册时分配，对应 appid）
weaver.sso.app-id=${WEAVER_SSO_APP_ID:fastgpt}
# 本服务的外网可达地址（用于CAS回调，对应 serverName）
weaver.sso.server-name=${WEAVER_SSO_SERVER_NAME:http://localhost:8080}
# 回调接口路径
weaver.sso.callback-path=${WEAVER_SSO_CALLBACK_PATH:/login/oauth/callback}

# ---------- CAS ticket 主动校验配置 ----------
# ticket 校验接口路径（ticket+service 换取账号，兼容 JSON / CAS 2.0 XML / 纯文本 yes\n账号）
weaver.sso.validate-path=${WEAVER_SSO_VALIDATE_PATH:/sso/validate}
# 校验请求方式 POST | GET（POST 返回 405/501 时自动改用 GET）
weaver.sso.validate-method=${WEAVER_SSO_VALIDATE_METHOD:POST}
# 校验接口超时时间（毫秒）
weaver.sso.validate-timeout=${WEAVER_SSO_VALIDATE_TIMEOUT:5000}
# 校验接口返回的成功码（仅 JSON 格式：约定 code=0 成功，data 返回用户信息）
weaver.sso.success-code=${WEAVER_SSO_SUCCESS_CODE:0}
# 校验失败后重新跳 CAS 登录的最大次数，超过后返回错误，避免无限重定向
weaver.sso.max-retry=${WEAVER_SSO_MAX_RETRY:2}
# service 是否携带 redirect_uri/state；泛微要求 service 与注册地址完全一致时设为 false
weaver.sso.service-include-redirect=${WEAVER_SSO_SERVICE_INCLUDE_REDIRECT:true}
# CAS 登出路径与登出后回跳地址（如 FastGPT 登录页）
weaver.sso.logout-path=${WEAVER_SSO_LOGOUT_PATH:/sso/logout}
weaver.sso.logout-redirect-url=${WEAVER_SSO_LOGOUT_REDIRECT_URL:}

# ========== CAS 账号 → FastGPT 用户 映射表 ==========
# CSV 文件：cas_account,fastgpt_username,member_name,contact,status；未映射或 status=0 的账号拒绝登录
# 文件修改后自动重新加载，无需重启
weaver.sso.user-mapping-file=${WEAVER_SSO_USER_MAPPING_FILE:./config/user-mapping.csv}
# 是否启用旧的 weaversso.jar Filter 链（被动校验模式，默认 false）
weaver.sso.filter-enabled=${WEAVER_SSO_FILTER_ENABLED:false}

# HR同步接口认证Token
weaver.sso.hr-sync-token=${WEAVER_SSO_HR_SYNC_TOKEN:}

# ========== CAS 返回属性映射 ==========
weaver.sso.attribute.username=${WEAVER_SSO_ATTR_USERNAME:loginid}
weaver.sso.attribute.member-name=${WEAVER_SSO_ATTR_MEMBER_NAME:lastname}
weaver.sso.attribute.email=${WEAVER_SSO_ATTR_EMAIL:email}
weaver.sso.attribute.mobile=${WEAVER_SSO_ATTR_MOBILE:mobile}
